  <div class="mycontainer">
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const pageDiv = document.getElementById('page');
      const mc = document.querySelector('.mycontainer');

      const F = (line, index) =>
      {
        var res = '<p>';
        var inSpan = false;
        for(const ch of line)
        {
          if(ch.charCodeAt(0)==128 || ch.charCodeAt(0)==1)
          {
            if(inSpan==true)
            {
              inSpan = false;
              res += "</span>";
            }
            res += " <span class='red'>&nbsp;";
            inSpan = true;
          }
          else if(ch.charCodeAt(0)==32)
          {
            res += "&nbsp;";
          }
          else
          {
            res += ch;
          }
        }
        if(inSpan===true)
        {
          inSpan = false;
          res += "</span>";
        }
        res += '</p>';
        return res;
      };

      const lines = pageDiv.innerText.split('\n');
      const paragraphs = lines.map((line, index) => F(line, index)).join('');
      mc.innerHTML = paragraphs;
    });
  </script>
</body>
